name: Deploy Diagnostic

on:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Run SSH diagnostic
        run: |
          echo "Connecting for diagnostic..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            echo '=== User ==='
            whoami
            echo
            echo '=== Current directory ==='
            pwd
            echo
            echo '=== Home directory ==='
            echo \$HOME
            echo
            echo '=== List /var/www ==='
            ls -la /var/www || echo 'Cannot access /var/www'
            echo
            echo '=== Search for mmcriativos ==='
            find / -maxdepth 3 -type d -name mmcriativos 2>/dev/null || echo 'Not found'
          "
