name: 🔍 SSH Diagnostic (heredoc safe)

on:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Run SSH diagnostic safely
        run: |
          echo "Running SSH diagnostic (heredoc mode)..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash <<'REMOTE'
            echo "=== USER ==="
            whoami
            echo

            echo "=== CURRENT DIR ==="
            pwd
            echo

            echo "=== HOME ==="
            echo $HOME
            echo

            echo "=== LIST /var/www ==="
            ls -la /var/www || echo "Cannot access /var/www"
            echo

            echo "=== SEARCH mmcriativos ==="
            find / -maxdepth 3 -type d -name mmcriativos 2>/dev/null || echo "Not found"
          REMOTE
