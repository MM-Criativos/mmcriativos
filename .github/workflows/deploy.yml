name: 🚀 Deploy para o Servidor

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🔐 Configurar acesso SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: 🚀 Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "bash -lc '
            set -e
            echo \"📡 Conectado ao servidor e iniciando o deploy...\"

            if [ -d /var/www/mmcriativos ]; then
              cd /var/www/mmcriativos
            else
              echo \"❌ Diretório /var/www/mmcriativos não encontrado!\"
              exit 1
            fi

            echo \"📦 Atualizando código...\"
            git pull origin main

            echo \"🧩 Instalando dependências...\"
            composer install --no-interaction --prefer-dist --optimize-autoloader

            echo \"🔧 Rodando migrations...\"
            php artisan migrate --force

            echo \"🧹 Limpando e otimizando cache...\"
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo \"✅ Deploy concluído com sucesso!\"
          '"
