name: SSH Diagnostic (safe inline)

on:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Run SSH diagnostic safely
        run: |
          echo "Running diagnostic via SSH..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "whoami && pwd && echo '--- /var/www ---' && ls -la /var/www || echo 'Cannot access /var/www' && echo '--- Search mmcriativos ---' && find / -maxdepth 3 -type d -name mmcriativos 2>/dev/null || echo 'Not found'"
