name: 🚀 Deploy para o Servidor (Produção)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: 🧩 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🔐 Configurar acesso SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: 🚀 Sincronizar arquivos com rsync
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          echo "Sincronizando arquivos para o servidor..."
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.env' \
            --exclude='storage/app/public' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ $SSH_USER@$SSH_HOST:/var/www/mmcriativos/

      - name: 🚀 Deploy para o servidor
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          echo "Iniciando deploy no servidor..."

          ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << 'REMOTE'
            set -e

            echo "📡 Conectado ao servidor como $(whoami)"

            cd /var/www/mmcriativos || { echo "❌ Diretório não encontrado!"; exit 1; }

            echo "🧩 Instalando dependências do Composer..."
            composer install --no-interaction --prefer-dist --optimize-autoloader || { echo "❌ Falha no composer"; exit 1; }

            echo "📦 Instalando dependências NPM..."
            npm ci || npm install || { echo "❌ Falha no npm install"; exit 1; }

            echo "🏗️ Rodando Vite build..."
            npm run build || { echo "❌ Falha no Vite build"; exit 1; }

            echo "🔗 Garantindo link de storage..."
            php artisan storage:link || true

            echo "🧰 Rodando migrations..."
            php artisan migrate --force || { echo "❌ Falha nas migrations"; exit 1; }

            echo "🧹 Limpando e otimizando cache..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🎉 Deploy concluído com sucesso!"
          REMOTE
