name: 🚀 Deploy para o Servidor

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🔐 Configurar acesso SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: 🚀 Deploy via SSH
        run: |
          echo "📡 Iniciando conexão SSH..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            echo "📡 Conectado ao servidor — iniciando deploy..."

            if [ ! -d /var/www/mmcriativos ]; then
              echo "❌ Diretório /var/www/mmcriativos não encontrado!"
              exit 1
            fi

            cd /var/www/mmcriativos

            echo "📦 Atualizando código..."
            git pull origin main || exit 1

            echo "🧩 Instalando dependências..."
            composer install --no-interaction --prefer-dist --optimize-autoloader || exit 1

            echo "🔧 Rodando migrations..."
            php artisan migrate --force || exit 1

            echo "🧹 Limpando e otimizando cache..."
            php artisan optimize:clear || exit 1
            php artisan config:cache || exit 1
            php artisan route:cache || exit 1
            php artisan view:cache || exit 1

            echo "✅ Deploy concluído com sucesso!"
          '
