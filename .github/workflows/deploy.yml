name: 🚀 Deploy para o Servidor (Produção)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🔐 Configurar acesso SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: 🚀 Deploy para o servidor
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          echo "Iniciando deploy no servidor..."
          
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST <<'REMOTE'
            set -e
            echo "📡 Conectado ao servidor como $(whoami)"

            # Caminho do projeto
            cd /var/www/mmcriativos || { echo "❌ Diretório não encontrado!"; exit 1; }

            echo "📦 Atualizando código..."
            # Garante que o repositório está autenticado com a chave SSH
            git pull origin main || { echo "❌ Falha no git pull"; exit 1; }

            echo "🧩 Instalando dependências..."
            composer install --no-interaction --prefer-dist --optimize-autoloader || { echo "❌ Falha no composer"; exit 1; }

            echo "🧰 Rodando migrations..."
            php artisan migrate --force || { echo "❌ Falha nas migrations"; exit 1; }

            echo "🧹 Limpando e otimizando cache..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "✅ Deploy concluído com sucesso!"
          REMOTE
