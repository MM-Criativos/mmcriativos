name: 🚀 Deploy para o Servidor

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🔐 Configurar acesso SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: 🧪 Diagnóstico SSH
        run: |
          echo "🔍 Conectando para diagnóstico..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            echo "👤 Usuário atual:"
            whoami

            echo "📂 Diretório atual:"
            pwd

            echo "🏠 Home:"
            echo $HOME

            echo "📁 Listando /var/www:"
            ls -la /var/www || echo "❌ Não conseguiu acessar /var/www"

            echo "📁 Listando /var:"
            ls -la /var || echo "❌ Não conseguiu acessar /var"

            echo "📁 Listando /:"
            ls -la / || echo "❌ Não conseguiu acessar raiz"

            echo "🔎 Buscando mmcriativos:"
            find / -maxdepth 3 -type d -name mmcriativos 2>/dev/null || echo "❌ Não encontrado"
          '
