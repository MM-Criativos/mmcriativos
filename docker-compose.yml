services:
  app:
    # -----------------------------------------------------------------
    # Mantenha esta configuração se você quer que o EasyPanel use seu Dockerfile
    # Caso contrário, se você removeu o Dockerfile, use 'image: webdevops/php-nginx:8.2'
    build: .
    # -----------------------------------------------------------------

    working_dir: /app

    volumes:
      - ./:/app

    environment:
      APP_ENV: production
      APP_DEBUG: false
      WEB_DOCUMENT_ROOT: /app/public

    # Use 'sleep' para resolver a falha temporária de DNS/DB
    command: >
      sh -c "
        sleep 5 &&
        composer install --no-dev --optimize-autoloader &&
        php artisan migrate --force &&
        php artisan optimize &&
        supervisord -c /opt/docker/etc/supervisor.conf
      "

    restart: unless-stopped
