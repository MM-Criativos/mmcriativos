services:
  app:
    image: webdevops/php-nginx:8.2
    working_dir: /app

    volumes:
      - ./:/app

    environment:
      APP_ENV: production
      APP_DEBUG: false
      WEB_DOCUMENT_ROOT: /app/public

    command: >
      sh -c "
        composer install --no-dev --optimize-autoloader &&
        php artisan migrate --force &&
        php artisan optimize &&
        supervisord -c /opt/docker/etc/supervisor.conf
      "

networks:
  default:
    external: true
