services:
  app:
    # Mantenha 'build: .' se você tem um Dockerfile na raiz.
    build: .
    working_dir: /app

    volumes:
      - ./:/app

    environment:
      APP_ENV: production
      APP_DEBUG: false
      WEB_DOCUMENT_ROOT: /app/public

    # -----------------------------------------------------------------
    # AÇÃO CRÍTICA: Implementar o loop de espera antes de migrar
    # -----------------------------------------------------------------
    command: >
      sh -c "
        composer install --no-dev --optimize-autoloader &&

        # Início do loop de espera (Wait-for-DB)
        ATTEMPTS=0;
        MAX_ATTEMPTS=20; # Tenta por até 100 segundos (20 * 5s)

        # O comando 'php artisan migrate' serve como teste de conexão
        while ! php artisan migrate --force; do
          if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
            echo '❌ Banco de dados indisponível após várias tentativas. Abortando.'
            exit 1 # Sai com erro se falhar todas as tentativas
          fi
          echo '⏳ Tentando conectar ao banco de dados... (Tentativa $ATTEMPTS/$MAX_ATTEMPTS)'
          ATTEMPTS=$((ATTEMPTS + 1));
          sleep 5; # Espera 5 segundos antes de tentar novamente
        done

        # Se o loop terminar, a migração foi bem-sucedida.
        echo '✅ Banco de dados conectado e migração concluída.'

        php artisan optimize &&
        supervisord -c /opt/docker/etc/supervisor.conf
      "

    restart: unless-stopped
