services:
  app:
    build: .
    working_dir: /app

    volumes:
      - ./:/app

    environment:
      APP_ENV: production
      APP_DEBUG: false
      WEB_DOCUMENT_ROOT: /app/public

    # Ação de comando: O MAIS SIMPLES POSSÍVEL, confiando no sleep e restart
    command: >
      sh -c "
        # Aumentamos o tempo de espera.
        sleep 20 &&
        composer install --no-dev --optimize-autoloader &&
        php artisan migrate --force &&
        php artisan optimize &&
        supervisord -c /opt/docker/etc/supervisor.conf
      "

    # CRÍTICO: Garante que ele tente várias vezes até o DB estar pronto.
    restart: unless-stopped
