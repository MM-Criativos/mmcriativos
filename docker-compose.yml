services:
  app:
    # Mantenha 'build: .', ele usará o Dockerfile atualizado
    build: .
    working_dir: /app

    volumes:
      - ./:/app

    environment:
      APP_ENV: production
      APP_DEBUG: false
      WEB_DOCUMENT_ROOT: /app/public

    # O comando que será executado (agora com NC instalado!)
    command: >
      sh -c "
        # O loop de espera com NC agora funcionará
        (for i in 1 2 3 4; do nc -z -v mm-criativos_mysql-mmcriativos 3306 && break || sleep 5; done) &&

        composer install --no-dev --optimize-autoloader &&
        php artisan migrate --force &&
        php artisan optimize &&
        supervisord -c /opt/docker/etc/supervisor.conf
      "

    restart: unless-stopped
