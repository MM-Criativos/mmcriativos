services:
  app:
    build: .
    working_dir: /app

    volumes:
      - ./:/app

    environment:
      APP_ENV: production
      APP_DEBUG: false
      WEB_DOCUMENT_ROOT: /app/public

    # AÇÃO CRÍTICA: Sintaxe de Bloco (|) e comandos concisos
    command: |
      sh -c "
        # 1. Espera de 30s. Esta sintaxe é muito simples para falhar no parsing.
        sleep 30 &&

        # 2. Executa toda a inicialização
        composer install --no-dev --optimize-autoloader &&
        php artisan migrate --force &&
        php artisan optimize &&
        supervisord -c /opt/docker/etc/supervisor.conf
      "

    restart: unless-stopped
