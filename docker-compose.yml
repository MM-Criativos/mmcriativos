services:
  app:
    build: .
    working_dir: /app

    volumes:
      - ./:/app

    environment:
      APP_ENV: production
      APP_DEBUG: false
      WEB_DOCUMENT_ROOT: /app/public

    # Ação de comando: Voltamos para o 'sleep 10' para cobrir o timing
    # Se o 'nc' (netcat) falhou na versão anterior, vamos evitar o script complexo.
    command: >
      sh -c "
        sleep 10 &&
        composer install --no-dev --optimize-autoloader &&
        php artisan migrate --force &&
        php artisan optimize &&
        supervisord -c /opt/docker/etc/supervisor.conf
      "

    restart: unless-stopped

    # -------------------------------------------------------------
    # NOVIDADE: ANEXAR O SERVIÇO À REDE PRINCIPAL
    # O nome da rede aqui pode ser o nome do seu projeto no EasyPanel.
    # Tente 'mm-criativos' ou apenas 'default'.
    networks:
      - mm-criativos
    # -------------------------------------------------------------


    # Definir a rede externa, usando o nome do projeto (mm-criativos)
    # ou o nome que o EasyPanel usa para a rede compartilhada.
networks:
  mm-criativos:
    external: true
