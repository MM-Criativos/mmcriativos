version: "3.8"

services:
  app:
    image: webdevops/php-nginx:8.2
    working_dir: /app

    volumes:
      - ./:/app

    environment:
      APP_ENV: production
      APP_DEBUG: false
      WEB_DOCUMENT_ROOT: /app/public

    command: >
      sh -c "
        composer install --no-dev --optimize-autoloader &&
        php artisan migrate --force &&
        php artisan optimize &&
        supervisord -c /opt/docker/etc/supervisor.conf
      "

    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: mmcriativos_mysql-mmcriativos
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mmcriativos
      MYSQL_USER: mmcloud
      MYSQL_PASSWORD: Or@Ch0910tknCE**
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
