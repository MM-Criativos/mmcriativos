services:
  app:
    build: .
    working_dir: /app

    volumes:
      - ./:/app

    environment:
      APP_ENV: production
      APP_DEBUG: false
      WEB_DOCUMENT_ROOT: /app/public

    # Ação de Comando: Simplificada para um 'sleep' longo.
    # Confiamos que o restart fará a conexão na segunda ou terceira tentativa.
    command: >
      sh -c "
        echo 'Aguardando 15 segundos para estabilização do DB...' &&
        sleep 15 &&
        composer install --no-dev --optimize-autoloader &&
        php artisan migrate --force &&
        php artisan optimize &&
        supervisord -c /opt/docker/etc/supervisor.conf
      "

    # CRÍTICO: Garante que ele tente várias vezes até o DB estar pronto.
    restart: unless-stopped
