services:
  app:
    # Mantenha 'build: .' se você manteve o Dockerfile.
    build: .
    working_dir: /app

    volumes:
      - ./:/app

    environment:
      APP_ENV: production
      APP_DEBUG: false
      WEB_DOCUMENT_ROOT: /app/public

    # ----------------------------------------------------------------------
    # Ação de comando: Wait-for-DB usando 'nc' e sintaxe simples.
    # Esta sintaxe de uma linha é crucial para evitar erros de parsing.
    # ----------------------------------------------------------------------
    command: >
      sh -c "
        # 1. Espera Ativa (NC) - Tenta conectar a porta 3306 4 vezes antes de prosseguir.
        # Esta é a parte mais crítica para evitar o erro de DNS/Timing.
        (for i in 1 2 3 4; do nc -z -v mm-criativos_mysql-mmcriativos 3306 && break || sleep 5; done) &&

        # 2. Comandos de Inicialização (só rodam se a porta 3306 estiver acessível)
        composer install --no-dev --optimize-autoloader &&
        php artisan migrate --force &&
        php artisan optimize &&
        supervisord -c /opt/docker/etc/supervisor.conf
      "

    restart: unless-stopped

# Não inclua 'networks'
# Não inclua 'depends_on'
